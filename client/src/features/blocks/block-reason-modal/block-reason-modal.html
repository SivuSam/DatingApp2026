<div *ngIf="visible" class="modal modal-open">
    <div class="modal-box">

        <h3 class="font-bold text-lg mb-4">{{ title }}</h3>

        <textarea class="textarea textarea-bordered w-full" maxlength="200" rows="5" [(ngModel)]="reason">
    </textarea>

        <div class="text-sm text-right mt-1">
            {{ reason.length }}/200
        </div>

        <div class="modal-action">
            <button class="btn" (click)="cancel.emit()">
                Cancel
            </button>

            <button class="btn btn-error" [disabled]="reason.trim().length === 0" (click)="onConfirm()">
                Confirm
            </button>

        </div>
    </div>
</div>
